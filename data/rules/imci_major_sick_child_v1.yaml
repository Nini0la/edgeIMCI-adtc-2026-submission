rule_set_id: imci-major-sick-child-v1
document: WHO Integrated Management of Childhood Illness, Chart Booklet
edition: March 2014
encoding_statement: EdgeIMCI machine-readable clinical rule set derived from the WHO IMCI Chart Booklet;
  not WHO-authored machine-readable rules.
population:
  age_months:
    gte: 2
    lt: 60
supported_assessments:
  - general_danger_signs
  - cough_or_difficult_breathing
  - diarrhoea
  - fever_including_measles
  - ear_problem
explicitly_out_of_scope:
  - young_infant_0_to_under_2_months
  - acute_malnutrition
  - anaemia
  - hiv_assessment_except_respiratory_action_dependency
  - immunization_vitamin_a_and_deworming_status
  - feeding_assessment
  - well_child_care
rules:
  - rule_id: IMCI-MSC-GDS-UNABLE-TO-DRINK
    kind: danger_sign
    source:
      section: General danger signs
      source_pdf_page: 5
      source_printed_page: 1 of 76
    conditions:
      field: danger_signs.unable_to_drink_or_breastfeed
      equals: true
    result:
      danger_sign: UNABLE_TO_DRINK_OR_BREASTFEED
      classification: VERY_SEVERE_DISEASE
      urgent: true
      actions:
        - COMPLETE_ASSESSMENT_QUICKLY
        - GIVE_PRE_REFERRAL_TREATMENT_IMMEDIATELY
        - PREVENT_LOW_BLOOD_SUGAR
        - KEEP_WARM
        - URGENT_REFERRAL
  - rule_id: IMCI-MSC-GDS-VOMITS-EVERYTHING
