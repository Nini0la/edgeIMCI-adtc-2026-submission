# Generated from configs/information_policy/imci_major_sick_child_holistic_completeness_v2.json.
# Edit the canonical JSON and rerun scripts/sync_holistic_artifacts.py; do not edit this mirror.
policy_id: imci-major-sick-child-holistic-completeness-v2
rule_set_id: imci-major-sick-child-v1
review_decision_set_id: imci-major-sick-child-review-decisions-v1
status: APPROVED_FOR_HACKATHON_SCOPE
description: Mechanical completeness and final-synthesis authorization policy for the five-area major sick-child
  encounter.
population:
  age_months:
    gte: 2
    lt: 60
supported_assessments:
  - general_danger_signs
  - cough_or_difficult_breathing
  - diarrhoea
  - fever_including_measles
  - ear_problem
product_authorization:
  final_holistic_synthesis_condition: SUPPORTED_ENCOUNTER_COMPLETE
  incomplete_exposes_final_classifications: false
  incomplete_exposes_final_management_synthesis: false
encounter_states:
  - state: COMPLETE
    final_holistic_synthesis_authorized: true
    behavior: EMIT_INTEGRATED_CLASSIFICATIONS_AND_MANAGEMENT
  - state: INCOMPLETE_NO_KNOWN_URGENT_FINDING
    final_holistic_synthesis_authorized: false
    behavior: REPORT_GROUPED_MISSING_ELEMENTS
  - state: INCOMPLETE_KNOWN_URGENT_FINDING
    final_holistic_synthesis_authorized: false
    behavior: EMIT_SOURCE_BACKED_URGENT_ACTIONS_AND_REPORT_INCOMPLETE
unknown_semantics:
  omitted_is_unknown: true
  unknown_is_negative: false
  silence_can_make_pathway_not_applicable: false
  explicit_negative_can_make_pathway_not_applicable: true
always_required:
  - patient_facts.age_months
  - danger_signs.unable_to_drink_or_breastfeed
  - danger_signs.vomits_everything
  - danger_signs.had_convulsions
  - danger_signs.lethargic_or_unconscious
  - danger_signs.convulsing_now
  - patient_facts.has_cough_or_difficult_breathing
  - patient_facts.has_diarrhoea
  - patient_facts.has_fever
  - patient_facts.has_ear_problem
conditional_requirements:
  - when:
      patient_facts.has_cough_or_difficult_breathing: true
    require:
      - respiratory.cough_duration_days
      - respiratory.respiratory_rate
      - respiratory.chest_indrawing
      - respiratory.stridor_when_calm
      - respiratory.wheezing
      - respiratory.recurrent_wheeze
      - respiratory.child_calm
      - respiratory.breaths_counted_one_minute
      - respiratory.pulse_oximeter_available
  - when:
      respiratory.pulse_oximeter_available: true
    require:
      - respiratory.oxygen_saturation_percent
  - when:
      respiratory.wheezing_with_fast_breathing_or_chest_indrawing: true
    require:
      - respiratory.bronchodilator_trial_completed
      - respiratory.post_bronchodilator_respiratory_rate
      - respiratory.post_bronchodilator_chest_indrawing
      - respiratory.post_bronchodilator_child_calm
      - respiratory.post_bronchodilator_breaths_counted_one_minute
  - when:
      respiratory.effective_chest_indrawing: true
    require:
      - respiratory.hiv_exposed_or_infected
  - when:
      patient_facts.has_diarrhoea: true
    require:
      - diarrhoea.duration_days
      - diarrhoea.blood_in_stool
      - diarrhoea.dehydration.restless_or_irritable
      - diarrhoea.dehydration.sunken_eyes
      - diarrhoea.dehydration.drinking_status
      - diarrhoea.dehydration.skin_pinch
  - when:
      classification: SEVERE_DEHYDRATION
      age_months:
        gte: 24
    require:
      - diarrhoea.cholera_in_area
  - when:
      patient_facts.has_fever: true
    require:
      - fever.temperature_c
      - fever.malaria_risk
      - fever.fever_duration_days
      - fever.stiff_neck
      - fever.runny_nose
      - fever.obvious_cause_of_fever_present
      - fever.identified_bacterial_cause_present
      - fever.measles_within_last_3_months
      - fever.generalized_rash
      - fever.measles_cough
      - fever.red_eyes
  - when:
      fever.fever_duration_days:
        gt: 7
    require:
      - fever.fever_present_every_day
  - when:
      fever.malaria_test_required: true
    require:
      - fever.malaria_test_available
  - when:
      fever.malaria_test_available: true
    require:
      - fever.malaria_test_result
  - when:
      fever.measles_now_or_within_last_3_months: true
    require:
      - fever.mouth_ulcers
      - fever.pus_draining_from_eye
      - fever.clouding_of_cornea
  - when:
      fever.mouth_ulcers: true
    require:
      - fever.mouth_ulcers_deep_or_extensive
  - when:
      patient_facts.has_ear_problem: true
    require:
      - ear.ear_pain
      - ear.ear_discharge_reported
      - ear.pus_draining_from_ear
      - ear.tender_swelling_behind_ear
  - when:
      ear.ear_discharge_reported: true
    require:
      - ear.ear_discharge_duration_days
invalid_evidence_blocks_completion:
  - respiratory.child_calm=false
  - respiratory.breaths_counted_one_minute=false
  - respiratory.post_bronchodilator_child_calm=false
  - respiratory.post_bronchodilator_breaths_counted_one_minute=false
contradictions_block_completion: true
encounter_specific_unresolved_question_ids_block_completion: true
approved_cross_evidence_reuse:
  source: danger_signs.unable_to_drink_or_breastfeed=true
  target: diarrhoea.dehydration.drinking_status=UNABLE
  direction: ONE_WAY_POSITIVE_ONLY
  requires_clinically_confirmed_source_evidence: true
urgent_action_semantics:
  independent_of_supported_encounter_complete: true
  surface_before_missing_elements: true
  does_not_authorize_final_holistic_synthesis: true
  defer_routine_home_care_and_scheduled_follow_up: true
  preserve_all_classifications: true
  first_dose_only_when_explicitly_source_indicated: true
initial_treatment_stage_semantics:
  plan_b_or_c_blocks_initial_assessment_completion: false
  emit_initial_classification_and_plan_immediately: true
  timed_reassessment_is_separate_submission: true
  detailed_plan_c_facility_branching_in_scope: false
missing_element_reporting:
  default: GROUP_BY_SUPPORTED_ASSESSMENT
  one_question_at_a_time_default: false
  preserve_previously_supplied_findings: true
resolved_questions:
  - IP-CQ-001
  - IP-CQ-002
  - IP-CQ-003
  - IP-CQ-004
  - MSC-CQ-SCOPE-001
  - MSC-CQ-RESP-001
  - MSC-CQ-RESP-002
  - MSC-CQ-DIARRHOEA-001
  - MSC-CQ-REASSESS-001
  - MSC-CQ-FEVER-001
  - MSC-CQ-FEVER-002
  - MSC-CQ-FEVER-003
  - MSC-CQ-EAR-001
unresolved_questions: []
