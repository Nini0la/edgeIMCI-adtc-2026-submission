[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "edge-imci"
version = "0.1.0"
description = "Experimental benchmark for bounded IMCI decision pathways on constrained hardware."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/edge_imci"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
